# The same checks `just verify` runs locally. Public repo: GitHub's hosted
# runners, not the org's own.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: extractions/setup-just@v4.0.0
      - run: just verify
