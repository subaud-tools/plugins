# tools-common renders every plugin here; take each release as a PR. Its CI
# fails while a plugin differs from the new render: regenerate with
# CLAUDEPLUGIN_UPDATE=1 go test ./... and commit the result on the PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    # Dependabot holds a new release for 3 days by default (cooldown days
    # must be 1-90, so 0 is not allowed); tools-common is ours and ships
    # several releases a day, so exclude it and take each release at once.
    cooldown:
      default-days: 3
      exclude:
        - github.com/subaud-tools/tools-common*
    allow:
      - dependency-name: github.com/subaud-tools/tools-common*
    commit-message:
      prefix: "chore(deps)"
